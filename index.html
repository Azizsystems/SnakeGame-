<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Snake Game</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="game-container">
      <h1>The Snake Game</h1>

      <!-- Scoreboard -->
      <div class="scoreboard">
        <span>Score: <strong id="score">0</strong></span>
        <span>High Score: <strong id="high-score">0</strong></span>
        <div class="controls">
          <button id="pause-btn" class="control-btn" onclick="togglePause()">
            ⏸ Pause
          </button>
          <button id="sound-btn" class="control-btn" onclick="toggleSound()">
            🔊 ON
          </button>
        </div>
      </div>

      <!-- Canvas Wrapper (holds Canvas + Game Over Play Again Button) -->
      <div class="canvas-wrapper">
        <canvas class="canvas" width="500" height="500"></canvas>
        <button id="restart-btn" class="restart-btn" onclick="restartGame()">
          ↻ Play Again
        </button>
      </div>

      <!-- Food Legend -->
      <div class="legend">
        <span><i class="box normal-food"></i> Normal Food (+1)</span>
        <span
          ><i class="box golden-food"></i> Golden Food (+5, 2x Size, 6s
          Timer!)</span
        >
      </div>
    </div>

    <!-- Our Script -->
    <script src="js/script.js"></script>
  </body>
</html>
